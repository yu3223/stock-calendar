name: Weekly Shareholders Meeting Update

on:
  # 1. 設定自動排程
  schedule:
    # 台灣時間：每週一早上 06:00 (UTC 時間：每週日 22:00)
    # cron 語法：分 時 日 月 星期 (0 代表週日)
    - cron: '0 22 * * 0'
  
  # 2. 允許手動觸發 (方便隨時在 GitHub 網頁上點擊測試)
  workflow_dispatch: 

jobs:
  update-shareholders-calendar:
    runs-on: ubuntu-latest

    steps:
    - name: 下載專案程式碼
      uses: actions/checkout@v4

    - name: 安裝 Python 環境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 安裝必備的 Python 套件
      run: |
        python -m pip install --upgrade pip
        pip install selenium webdriver-manager beautifulsoup4 pandas google-api-python-client google-auth lxml html5lib

    - name: 建立 credentials.json 金鑰檔案
      run: |
        echo '${{ secrets.GCP_CREDENTIALS }}' > credentials.json

    - name: 步驟一：執行股東會爬蟲 (產生 CSV)
      run: |
        python fetch_shareholders_meetings.py

    - name: 步驟二：比對白名單並上傳至日曆
      run: |
        python upload_shareholders_meetings.py