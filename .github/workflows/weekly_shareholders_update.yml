name: Weekly Shareholders Meeting Update

on:
  # 1. 設定自動排程 (每週執行)
  schedule:
    # 這裡設定為：每週日 UTC 00:00 (台灣時間週日早上 08:00 AM)
    # cron 語法對應：分 時 日 月 星期 (0 代表週日)
    - cron: '0 0 * * 0'
  
  # 2. 允許手動觸發 (方便你隨時在 GitHub 網頁上點擊測試)
  workflow_dispatch: 

jobs:
  update-shareholders-calendar:
    runs-on: ubuntu-latest

    steps:
    - name: 下載專案程式碼
      uses: actions/checkout@v4

    - name: 安裝 Python 環境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 安裝必備的 Python 套件
      run: |
        python -m pip install --upgrade pip
        pip install selenium webdriver-manager beautifulsoup4 pandas google-api-python-client google-auth lxml html5lib

    - name: 從隱形保險箱解鎖並建立 credentials.json
      run: |
        echo '${{ secrets.GCP_CREDENTIALS }}' > credentials.json

    - name: 步驟一：執行股東會爬蟲 (產生 CSV)
      run: |
        python fetch_shareholders_meetings.py

    # 👇 新增這個步驟：如果上面失敗了，就把截圖抓下來給你看
    - name: 📤 上傳偵錯截圖
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: debug-screenshot
        path: error_screenshot.png

    - name: 步驟二：比對白名單並上傳至日曆
      run: |
        python upload_shareholders_meetings.py