name: Daily Calendar Update

on:
  # 1. 設定自動排程 (每天執行)
  schedule:
    # 這裡設定為：每天 UTC 00:00 (台灣時間 08:00 AM)
    - cron: '0 0 * * *'
  
  # 2. 允許手動觸發
  workflow_dispatch: 

jobs:
  update-calendar:
    runs-on: ubuntu-latest

    steps:
    - name: 下載你的專案程式碼
      uses: actions/checkout@v3

    - name: 安裝 Python 環境
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 安裝必備的 Python 套件
      run: |
        python -m pip install --upgrade pip
        pip install selenium webdriver-manager beautifulsoup4 pandas google-api-python-client google-auth

    - name: 從隱形保險箱解鎖並建立 credentials.json
      run: |
        echo '${{ secrets.GCP_CREDENTIALS }}' > credentials.json

    # --- 任務一：法說會資訊更新 ---
    - name: 執行法說會爬蟲與更新
      run: |
        python fetch_mops.py 
        python upload_calendar.py

    # --- 任務二：財務報告 (董事會) 資訊更新 ---
    - name: 執行財務報告爬蟲與更新
      run: |
        python fetch_mops_board_meetings.py
        python upload_financial_reports.py