name: Monthly Calendar Update

on:
  # 1. 設定自動排程 (cron 語法)
  schedule:
    # 這裡設定為：每個月的 1 號，UTC 時間凌晨 0 點 (台灣時間早上 8 點) 執行
    - cron: '0 0 1 * *'
  
  # 2. 允許手動觸發 (超重要！這樣你隨時可以點按鈕測試，不用等一個月)
  workflow_dispatch: 

jobs:
  update-calendar:
    runs-on: ubuntu-latest # 使用最新版的 Linux 虛擬機

    steps:
    - name: 下載你的專案程式碼
      uses: actions/checkout@v3

    - name: 安裝 Python 環境
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 安裝必備的 Python 套件
      run: |
        python -m pip install --upgrade pip
        # 安裝我們爬蟲和 Google API 用到的套件
        pip install selenium webdriver-manager beautifulsoup4 pandas google-api-python-client google-auth

    - name: 從隱形保險箱解鎖並建立 credentials.json
      run: |
        echo '${{ secrets.GCP_CREDENTIALS }}' > credentials.json

    - name: 執行爬蟲與行事曆更新
      run: |
        # 請確保這裡的檔名跟你實際的 Python 檔名一模一樣
        # 1. 先執行 Selenium 爬蟲抓取資料並產生 CSV
        python fetch_mops.py 
        # 2. 再執行 Google 日曆上傳程式
        python upload_calendar.py